<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>PoseMatch</title>

<!--
  Pagina di destinazione del link inserito nella caption di condivisione
  (vedi lib/core/sharing/share_links.dart). Vive su un path dedicato
  (/share/) separato dalla root del sito, che resta la privacy policy.

  App pubblicata. Questa pagina fa da "smart link" unico per la condivisione:
  - su Android reindirizza subito al Play Store;
  - su iOS/iPadOS reindirizza subito all'App Store;
  - su desktop (o UA non riconosciuto) resta visibile con i due badge store.

  Il redirect è client-side (GitHub Pages non ha redirect server-side) e gira
  in un piccolo <script> nell'<head>, prima del render: sui telefoni la pagina
  non viene mai disegnata, si va dritti allo store. Il crawler dell'anteprima
  di WhatsApp/social NON esegue JS, quindi legge comunque i tag OG statici qui
  sotto e mostra un'anteprima pulita.

  Config: APPLE_APP_ID (Apple ID numerico) e il package Android sono nello
  <script> qui sotto. Se APPLE_APP_ID torna al placeholder 'XXXXXXXXXX', il
  redirect iOS si disattiva da solo (si cade sulla pagina con i badge) per non
  mandare gli utenti a un link App Store rotto.

  Quando si vorrà un vero deep link (Universal Links / App Links: apre l'app
  se installata) è questo il dominio/path su cui vanno configurati i file
  apple-app-site-association / assetlinks.json.
-->

<meta name="description" content="PoseMatch: overlay a reference photo on your camera and nail the perfect matching pose." />
<meta property="og:type" content="website" />
<meta property="og:title" content="PoseMatch" />
<meta property="og:description" content="See your pose match the reference in real time, then take a clean shot — no overlay burned in." />
<meta property="og:image" content="https://fcaimi.github.io/pose_match_app/share/screen3.png" />
<meta property="og:url" content="https://fcaimi.github.io/pose_match_app/share/" />
<meta name="twitter:card" content="summary_large_image" />

<script>
  // Smart link store: definisce gli URL una volta sola e reindirizza i mobile
  // PRIMA del render. I badge nel body riusano window.STORE_LINKS.
  (function () {
    // === UNICA COSA DA CONFIGURARE ===
    // Apple ID numerico dell'app (App Store Connect → App Information → Apple ID).
    var APPLE_APP_ID = '6796277310';
    // =================================

    var ANDROID_PACKAGE = 'com.fcaimi.posematch';
    var links = {
      appStore: 'https://apps.apple.com/app/id' + APPLE_APP_ID,
      playStore: 'https://play.google.com/store/apps/details?id=' + ANDROID_PACKAGE,
      appleConfigured: APPLE_APP_ID !== 'XXXXXXXXXX' && APPLE_APP_ID !== ''
    };
    window.STORE_LINKS = links;

    try {
      // Bypass per test / anteprima desktop:  ...?noredirect
      if (location.search.indexOf('noredirect') !== -1) return;

      var ua = navigator.userAgent || navigator.vendor || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        // iPadOS 13+ si presenta come Safari desktop su Mac con touch
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (isAndroid) {
        location.replace(links.playStore);
      } else if (isIOS && links.appleConfigured) {
        location.replace(links.appStore);
      }
    } catch (e) {
      // Qualunque errore: si resta sulla pagina con i badge.
    }
  })();
</script>

<style>
  :root {
    --bg-primary: #0A0A0F;
    --bg-secondary: #16161D;
    --surface: #1F1F28;
    --accent: #FF4D8D;
    --accent-alt: #6C5CE7;
    --text-primary: #FFFFFF;
    --text-secondary: #A0A0AC;
    --border: #2A2A35;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 32px;
  }

  main {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  h1.wordmark {
    font-size: clamp(40px, 10vw, 56px);
    font-weight: 800;
    letter-spacing: -1.5px;
    margin: 0 0 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-alt));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.tagline {
    font-size: 17px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.5;
    max-width: 440px;
    margin: 0 0 8px;
  }

  p.subtitle {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.5;
    max-width: 420px;
    margin: 0 0 32px;
  }

  .slideshow {
    position: relative;
    width: 100%;
    max-width: 240px;
    aspect-ratio: 1242 / 2688;
    border-radius: 28px;
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 20px 60px -20px rgba(255, 77, 141, 0.35);
  }

  .slideshow img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .slideshow img.active {
    opacity: 1;
  }

  .slideshow-dots {
    display: flex;
    gap: 6px;
    margin-bottom: 32px;
  }

  .slideshow-dots button {
    width: 6px;
    height: 6px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: var(--border);
    cursor: pointer;
  }

  .slideshow-dots button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-alt));
  }

  .store-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin: 0 0 40px;
  }

  .store-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-width: 180px;
    padding: 10px 18px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    text-decoration: none;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .store-badge:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .store-badge__glyph {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    color: var(--text-primary);
  }

  .store-badge__text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
    text-align: left;
  }

  .store-badge__small {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .store-badge__big {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  footer {
    margin-top: auto;
    padding-top: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  footer a {
    color: var(--text-secondary);
    text-decoration: underline;
  }

  .lang-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .lang-toggle button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  .lang-toggle button.active {
    color: var(--text-primary);
    border-color: var(--text-secondary);
  }

  .logo-mark {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .logo-mark svg {
    width: 36px;
    height: 36px;
  }
</style>
</head>
<body>

<div class="lang-toggle">
  <button type="button" data-lang="it">IT</button>
  <button type="button" data-lang="en" class="active">EN</button>
</div>

<main>
  <div class="logo-mark" aria-hidden="true">
    <svg viewBox="0 0 1024 1024">
      <defs>
        <clipPath id="lensClip">
          <circle cx="390" cy="512" r="320" />
        </clipPath>
      </defs>
      <circle cx="390" cy="512" r="320" fill="#FF4D8D" />
      <circle cx="634" cy="512" r="320" fill="#6C5CE7" />
      <circle cx="634" cy="512" r="320" fill="#9D54B7" clip-path="url(#lensClip)" />
    </svg>
  </div>

  <h1 class="wordmark">PoseMatch</h1>

  <p class="tagline" data-it="Vedi la tua posa allinearsi alla reference in tempo reale, poi scatta una foto pulita, senza overlay bruciato dentro."
                       data-en="See your pose match the reference in real time, then take a clean shot — no overlay burned in.">
    See your pose match the reference in real time, then take a clean shot — no overlay burned in.
  </p>

  <p class="subtitle" data-it="Nessuna registrazione, funziona completamente offline."
                       data-en="No sign-up, works fully offline.">
    No sign-up, works fully offline.
  </p>

  <div class="slideshow" id="slideshow">
    <img src="screen1.png" alt="PoseMatch — scegli la reference" class="active" />
    <img src="screen2.png" alt="PoseMatch — allinea la posa" />
    <img src="screen3.png" alt="PoseMatch — scatto finale" />

  <div class="slideshow-dots" id="slideshow-dots">

    <button type="button" data-index="1" aria-label="Slide 2"></button>

  </div>

  <div class="store-row">
    <a class="store-badge" id="appstore-link" href="https://apps.apple.com/app/id6796277310" rel="noopener">
      <svg class="store-badge__glyph" viewBox="0 0 384 512" aria-hidden="true">
        <path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zM262.1 104.5c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26 2 49.9-11.4 69.5-34.3z"/>
      </svg>
      <span class="store-badge__text">
        <span class="store-badge__small" data-it="Scarica su" data-en="Download on the">Download on the</span>
        <span class="store-badge__big">App Store</span>
      </span>
    </a>

    <a class="store-badge" id="playstore-link" href="https://play.google.com/store/apps/details?id=com.fcaimi.posematch" rel="noopener">
      <svg class="store-badge__glyph" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3 2.5v19a1 1 0 0 0 1.53.85l15.5-9.5a1 1 0 0 0 0-1.7L4.53 1.65A1 1 0 0 0 3 2.5z"/>
      </svg>
      <span class="store-badge__text">
        <span class="store-badge__small" data-it="Scaricala da" data-en="Get it on">Get it on</span>
        <span class="store-badge__big">Google Play</span>
      </span>
    </a>
  </div>

  <footer>
    <a href="https://fcaimi.github.io/pose_match_app/" data-it="Privacy Policy" data-en="Privacy Policy">Privacy Policy</a>
    <span>·</span>
    <a href="https://fcaimi.github.io/pose_match_app/terms.html" data-it="Termini di Servizio" data-en="Terms of Service">Terms of Service</a>
  </footer>
</main>

<script>
  // Allinea gli href dei badge agli URL definiti nell'<head> (fonte unica).
  (function () {
    var links = window.STORE_LINKS;
    if (!links) return;
    var appStore = document.getElementById('appstore-link');
    var playStore = document.getElementById('playstore-link');
    if (appStore && links.appleConfigured) appStore.href = links.appStore;
    if (playStore) playStore.href = links.playStore;
  })();

  (function () {
    var slides = document.querySelectorAll('#slideshow img');
    var dots = document.querySelectorAll('#slideshow-dots button');
    var current = 0;
    var timer = null;

    function goTo(index) {
      current = index;
      slides.forEach(function (img, i) {
        img.classList.toggle('active', i === index);
      });
      dots.forEach(function (dot, i) {
        dot.classList.toggle('active', i === index);
      });
    }

    function restartAutoplay() {
      if (timer) clearInterval(timer);
      timer = setInterval(function () {
        goTo((current + 1) % slides.length);
      }, 3500);
    }

    dots.forEach(function (dot) {
      dot.addEventListener('click', function () {
        goTo(parseInt(dot.getAttribute('data-index'), 10));
        restartAutoplay();
      });
    });

    restartAutoplay();
  })();

  (function () {
    var nodes = document.querySelectorAll('[data-it][data-en]');
    var buttons = document.querySelectorAll('.lang-toggle button');

    function applyLang(lang) {
      nodes.forEach(function (el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      buttons.forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });
      document.documentElement.lang = lang;
      try { localStorage.setItem('posematch-lang', lang); } catch (e) {}
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyLang(btn.getAttribute('data-lang'));
      });
    });

    var saved = null;
    try { saved = localStorage.getItem('posematch-lang'); } catch (e) {}
    var detected = (navigator.language || 'en').toLowerCase().indexOf('it') === 0 ? 'it' : 'en';
    applyLang(saved || detected);
  })();
</script>

</body>
</html>
